<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trials, diagnostic tests and screening: interactive practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Shared styles for the epidemiology interactives.
   Colour carries meaning across every activity:
   cobalt = treatment arm / has the disease, ochre = control arm / no disease. */
:root {
  --paper: #F2F5F4;
  --surface: #FFFFFF;
  --ink: #15252C;
  --muted: #56676E;
  --rule: #D2DBD9;
  --a: #2E56D8;        /* treatment / diseased */
  --a-soft: #D9E2FB;
  --b: #C98A10;        /* control / not diseased */
  --b-soft: #F6E9C9;
  --bad: #C4364C;
  --good: #1E8660;
  --focus: #2E56D8;
  --font: "Public Sans", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F171B;
    --surface: #172329;
    --ink: #E4ECEE;
    --muted: #97A9B0;
    --rule: #2B3A41;
    --a: #7E9CFF;
    --a-soft: #22305C;
    --b: #EDB547;
    --b-soft: #46371A;
    --bad: #FF7B8D;
    --good: #52D2A2;
    --focus: #7E9CFF;
  }
}
:root[data-theme="dark"] {
    --paper: #0F171B;
    --surface: #172329;
    --ink: #E4ECEE;
    --muted: #97A9B0;
    --rule: #2B3A41;
    --a: #7E9CFF;
    --a-soft: #22305C;
    --b: #EDB547;
    --b-soft: #46371A;
    --bad: #FF7B8D;
    --good: #52D2A2;
    --focus: #7E9CFF;
}

* { box-sizing: border-box; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }

.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 0; margin-bottom: 28px; border-bottom: 1px solid var(--rule);
}
.back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; }
.back:hover { color: var(--ink); }
.back::before { content: "‹\00a0"; }
.lang-toggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.lang-toggle button {
  font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted);
  padding: 4px 13px; cursor: pointer;
}
.lang-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.12; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.012em; }
h2 { font-size: 20px; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 16px; margin: 0 0 8px; font-weight: 700; }
p { margin: 0 0 12px; }
.lede { max-width: 68ch; color: var(--muted); font-size: 17px; margin: 0 0 28px; }
.small { font-size: 14px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.a { color: var(--a); } .b { color: var(--b); }
.good { color: var(--good); } .bad { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 20px; }
.stack > * + * { margin-top: 20px; }
.cols { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.cols-2-1 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); }
@media (max-width: 820px) { .cols-2-1 { grid-template-columns: 1fr; } }

.btn {
  font: inherit; font-size: 15px; font-weight: 600; line-height: 1.2;
  padding: 9px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
}
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); filter: none; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.field { margin: 0 0 14px; }
.field label, .field .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.field output { font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }

.scroll-x { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: middle; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t thead th { font-size: 13px; color: var(--muted); font-weight: 600; }

/* Drag-and-type number cells */
input.scrub {
  font: inherit; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px;
  width: 4.6em; text-align: center; padding: 6px 4px; border-radius: 6px;
  border: 1px dashed var(--muted); background: var(--paper); color: var(--ink);
  cursor: ew-resize; touch-action: none; -moz-appearance: textfield;
}
input.scrub::-webkit-inner-spin-button, input.scrub::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.scrub:focus { cursor: text; border-style: solid; border-color: var(--ink); }
input.scrub.scrubbing { border-style: solid; border-color: var(--a); }

.formula { font-variant-numeric: tabular-nums; font-size: 15px; }
.formula b { font-size: 17px; }
.big { font-size: 34px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }

.notice { margin-top: 32px; padding: 14px 18px; border-left: 4px solid var(--ink); background: var(--surface); max-width: 82ch; border-radius: 0 8px 8px 0; }
.notice h2 { font-size: 17px; margin-bottom: 6px; }
.notice ul { margin: 0; padding-left: 20px; }
.notice li + li { margin-top: 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg text { font-family: var(--font); }
svg text.halo, svg text.ortxt { paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
svg .drag-handle { cursor: ew-resize; touch-action: none; }
svg .drag-handle:focus { outline: none; }
svg .drag-handle:focus-visible .ring { stroke: var(--focus); stroke-width: 3; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- missions ---------- */
.missions { border-left: 4px solid var(--good); }
.m-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.m-head h2 { margin: 0; }
.m-count { font-weight: 800; font-size: 20px; }
.m-prog { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; margin: 8px 0 14px; }
.m-prog i { display: block; height: 100%; background: var(--good); transition: width .5s; }
.m-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px 24px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.m-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4; }
.m-box { flex: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; margin-top: 1px; position: relative; transition: background .2s, border-color .2s; }
.m-list li.done .m-box { background: var(--good); border-color: var(--good); }
.m-list li.done .m-box::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.m-list li.done .m-txt { color: var(--muted); }
.m-list li.just { animation: m-pop .6s ease; }
@keyframes m-pop { 0% { transform: scale(1); } 35% { transform: scale(1.05); } 100% { transform: scale(1); } }
.m-all { font-weight: 700; color: var(--good); margin: 12px 0 0; }
.m-reset { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; margin-top: 12px; padding: 0; }
.epi-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 2100; transition: transform .35s cubic-bezier(.2,.7,.2,1); max-width: calc(100vw - 32px); text-align: center; }
.epi-toast.show { transform: translate(-50%, 0); }

/* ---------- guessing game ---------- */
.game { border-left: 4px solid var(--a); }
.gg-q { font-size: 17px; margin-bottom: 12px; }
.gg-row { display: flex; gap: 16px; align-items: center; }
.gg-row input { flex: 1; }
.gg-val { font-size: 30px; font-weight: 800; width: 110px; flex: none; text-align: right; }
.gg-track { position: relative; height: 44px; margin: 6px 126px 0 0; border-bottom: 2px solid var(--rule); }
.gg-row + .gg-track + .btn-row { margin-top: 30px !important; }
.gg-band { position: absolute; bottom: 0; height: 12px; background: color-mix(in srgb, var(--good) 30%, transparent); border-radius: 3px; }
.gg-mk { position: absolute; bottom: 0; width: 0; }
.gg-mk::before { content: ""; position: absolute; bottom: 0; left: -1.5px; width: 3px; height: 26px; border-radius: 2px; }
.gg-mk b { position: absolute; bottom: 28px; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
.gg-mk.ans::before { background: var(--good); } .gg-mk.ans b { color: var(--good); }
.gg-mk.you::before { background: var(--ink); height: 18px; } .gg-mk.you b { bottom: -22px; color: var(--ink); }
.gg-fb { font-weight: 800; font-size: 18px; margin: 18px 0 4px; }
.gg-ex { font-size: 15px; color: var(--muted); }
.btn.play::before { content: "▶\00a0"; font-size: 12px; }

/* ---------- step-by-step explainer ---------- */
.loop-panel { padding: 0; overflow: hidden; margin-bottom: 20px; }
.loop svg { display: block; width: 100%; height: auto; }
.loop svg text { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.loop-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.loop-btn, .loop-pp { width: 38px; height: 38px; flex: none; border-radius: 50%; cursor: pointer; line-height: 1; }
.loop-btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-size: 22px; padding-bottom: 3px; }
.loop-btn:hover { border-color: var(--ink); }
.loop-pp { border: 0; background: var(--ink); color: var(--paper); font-size: 13px; }
.loop.waiting .loop-pp, .waiting .loop-pp { animation: loop-nudge 1.4s ease-in-out infinite; }
@keyframes loop-nudge { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ink) 40%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.loop-step { font-weight: 700; margin-left: 6px; }
.loop-opts { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.loop-speed { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.loop-speed button { font: inherit; font-size: 13px; border: 0; background: var(--surface); color: var(--muted); padding: 4px 12px; cursor: pointer; }
.loop-speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.loop-opts .check { font-size: 14px; }
.loop-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 880px) { .loop-body { grid-template-columns: 1fr; } }
.loop-stage { border-right: 1px solid var(--rule); }
@media (max-width: 880px) { .loop-stage { border-right: 0; border-bottom: 1px solid var(--rule); } }
.loop-prog { height: 4px; background: var(--paper); }
.loop-prog i { display: block; height: 100%; background: var(--ink); }
.loop-side { position: relative; min-height: 200px; }
.loop-steps { list-style: none; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; position: absolute; inset: 0; overflow-y: auto; }
@media (max-width: 880px) { .loop-side { min-height: 0; } .loop-steps { position: static; } }
.loop-steps li { border-radius: 8px; }
.loop-steps li button { font: inherit; display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; cursor: pointer; color: var(--muted); border-radius: 8px; }
.loop-steps li button:hover { background: var(--paper); }
.loop-steps .n { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.loop-steps .tt { font-size: 14px; font-weight: 600; line-height: 1.35; padding-top: 1px; }
.loop-steps li.past .n { background: var(--rule); }
.loop-steps li.on { background: var(--paper); }
.loop-steps li.on button { color: var(--ink); }
.loop-steps li.on .n { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.loop-steps li.on .tt { font-size: 16px; font-weight: 800; }
.loop-steps li p { margin: 0; padding: 0 12px 12px 40px; font-size: 15px; line-height: 1.5; animation: loop-in .4s ease; }
@keyframes loop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 6px; margin: -8px 0 20px; border-bottom: 2px solid var(--rule); scroll-margin-top: 12px; }
.tabs button { font: inherit; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px 12px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .ic { font-size: 13px; }
.tab-badge { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); }
.tab-next { display: flex; justify-content: flex-end; margin: 18px 0 0; }
@media (max-width: 520px) { .tabs button { padding: 10px 10px 12px; font-size: 15px; } }

</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-index"><style>
  .topbar { justify-content: flex-end; }
  .hero { max-width: 760px; margin-bottom: 40px; }
  .group { margin-bottom: 40px; }
  .group h2 { font-size: 15px; color: var(--muted); font-weight: 700; padding-bottom: 8px; border-bottom: 2px solid var(--ink); margin-bottom: 0; }
  .group[data-c="a"] h2 { border-color: var(--a); }
  .group[data-c="b"] h2 { border-color: var(--b); }
  .group[data-c="r"] h2 { border-color: var(--bad); }
  .act { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
  .act:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .act .name { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .act .desc { color: var(--muted); max-width: 66ch; grid-column: 1; }
  .act .how { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 14px; color: var(--ink); border-left: 3px solid var(--rule); padding-left: 12px; }
  @media (max-width: 640px) { .act { grid-template-columns: 1fr; } .act .how { grid-column: 1; grid-row: auto; } }
  .pips { display: flex; gap: 4px; margin-top: 8px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--good); display: block; }
  .pips i.on { background: var(--good); }
  .pips.full::after { content: "★"; color: var(--good); font-size: 14px; line-height: 10px; margin-left: 4px; }
  .overall { max-width: 520px; margin: -12px 0 40px; }
  .overall .bar { height: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .overall .bar i { display: block; height: 100%; background: var(--good); transition: width .6s; }
  footer { color: var(--muted); font-size: 14px; margin-top: 24px; }
</style>
<div class="wrap">
  <header class="topbar">
    <div class="lang-toggle" role="group" aria-label="Language / 語言"><button data-lang="en" lang="en">English</button><button data-lang="zh" lang="zh-Hant">繁體中文</button></div>
  </header>

  <div class="hero">
    <h1 data-i18n="title">Trials, diagnostic tests and screening</h1>
    <p class="lede" data-i18n="lede">Twelve short interactive activities to go with Office hour 3. Each one takes a few minutes: drag, change the numbers, and see the concept respond.</p>
  </div>

  <div class="overall"><div id="overallTxt" style="font-weight:700"></div><div class="bar" aria-hidden="true"><i id="overallBar"></i></div></div>

  <section class="group" data-c="a">
    <h2 data-i18n="g1">Randomized controlled trials</h2>
    <a class="act" href="#randomization"><span class="name" data-i18n="t1">Randomize or hand-pick?</span><span class="desc" data-i18n="d1">Allocate patients yourself, then reveal an unmeasured risk factor. Compare with simple and stratified randomization, and see why trial size matters.</span><span class="how" data-i18n="h1">Drag patient cards into arms</span></a>
    <a class="act" href="#concealment-blinding"><span class="name" data-i18n="t2">Concealment vs. blinding</span><span class="desc" data-i18n="d2">Sort statements into allocation concealment or blinding, name single-, double- and triple-blind designs, and try the information bias quiz.</span><span class="how" data-i18n="h2">Drag statements into boxes</span></a>
    <a class="act" href="#power"><span class="name" data-i18n="t8">Type I and type II errors</span><span class="desc" data-i18n="d8">See false positives, false negatives and power as areas under two curves, and how sample size and effect size change them.</span><span class="how" data-i18n="h8">Drag the decision line</span></a>
    <a class="act" href="#nnt"><span class="name" data-i18n="t9">Relative risk, risk difference and NNT</span><span class="desc" data-i18n="d9">Two arrays of 1,000 patients show why the same relative risk can mean an NNT of 20 or 200.</span><span class="how" data-i18n="h9">Drag the risk sliders</span></a>
    <a class="act" href="#itt"><span class="name" data-i18n="t3">Intention-to-treat vs. as-treated</span><span class="desc" data-i18n="d3">Work through the crossover exercise, then see how frail patients switching treatment can make a useless drug look protective.</span><span class="how" data-i18n="h3">Drag numbers in the table</span></a>
  </section>

  <section class="group" data-c="b">
    <h2 data-i18n="g2">Diagnostic and screening tests</h2>
    <a class="act" href="#diagnostic"><span class="name" data-i18n="t4">Cutoffs, prevalence and predictive values</span><span class="desc" data-i18n="d4">Move a test's cutoff to trade sensitivity against specificity, and watch PPV and NPV shift with prevalence.</span><span class="how" data-i18n="h4">Drag the cutoff and the prevalence</span></a>
    <a class="act" href="#multiple-tests"><span class="name" data-i18n="t5">Sequential vs. simultaneous testing</span><span class="desc" data-i18n="d5">Follow 1,000 people through two tests combined in series or in parallel, and compare net sensitivity, specificity and cost.</span><span class="how" data-i18n="h5">Drag the sliders</span></a>
    <a class="act" href="#kappa"><span class="name" data-i18n="t6">Agreement beyond chance: kappa</span><span class="desc" data-i18n="d6">Two physicians rate the same knees. Separate the agreement expected by chance from real agreement, including the rare-finding trap.</span><span class="how" data-i18n="h6">Drag numbers in the table</span></a>
    <a class="act" href="#screening-bias"><span class="name" data-i18n="t7">Lead-time, length-time and over-diagnosis bias</span><span class="desc" data-i18n="d7">See how screening can lengthen survival after diagnosis without delaying death, and why a screening round catches slow-growing tumours.</span><span class="how" data-i18n="h7">Drag points on timelines</span></a>
  </section>

  <section class="group" data-c="r">
    <h2 data-i18n="g3">Bias, confounding and effect modification</h2>
    <a class="act" href="#confounding-selection"><span class="name" data-i18n="t11">Confounding vs. selection bias</span><span class="desc" data-i18n="d11">Watch a third factor distort a comparison, then watch drop-outs do it in a perfectly randomized trial. Sort ten scenarios into confounding, selection bias or information bias.</span><span class="how" data-i18n="h11">Causal diagrams, sort the biases</span></a>
    <a class="act" href="#effect-modification"><span class="name" data-i18n="t12">Confounding vs. effect modification</span><span class="desc" data-i18n="d12">Stratify by a third factor and compare: similar stratum RRs that differ from the crude RR signal confounding; stratum RRs that differ from each other signal effect modification.</span><span class="how" data-i18n="h12">Build scenarios, diagnose studies</span></a>
    <a class="act" href="#misclassification"><span class="name" data-i18n="t10">Non-differential vs. differential misclassification</span><span class="desc" data-i18n="d10">Make the exposure questionnaire less accurate in cases, controls or both, and watch the odds ratio move towards or away from the null.</span><span class="how" data-i18n="h10">Drag sensitivity and specificity</span></a>
  </section>

      ggLock: "確定我的猜測", ggNext: "下一回合", ggYour: "你的猜測", ggAns: "答案", ggHit: "誤差在 {tol} 以內，厲害！", ggMiss: "相差 {d}，再接再厲！", ggScore: "回合：{r}・猜中：{h}・連勝：{s}",

  /* Drag a card element into any ancestor-independent element marked [data-zone]. */
  function dragToZones(el, opts) {

      el.style.top = (e.clientY - oy) + "px";

  /* Number input that changes when dragged horizontally; a plain click focuses it for typing. */
  function scrub(input, onChange, step) {
    step = step || 1;
    const min = input.min !== "" ? Number(input.min) : -Infinity;
    const max = input.max !== "" ? Number(input.max) : Infinity;

      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v -= st;

          host.querySelector("[data-r='1']").textContent = t("loopNormal");

      pp.innerHTML = playingNow ? "&#10074;&#10074;" : "&#9654;";
      pp.setAttribute("aria-label", t(playingNow ? "loopPause" : state === "waiting" ? "loopNext" : "loopPlay"));
      const s = sc[idx], within = state === "dwell" || state === "waiting" ? 1 : Math.max(0, Math.min(1, (tm - s.t) / (s.hold - s.t)));

    host.querySelector("[data-a=prev]").onclick = () => go(idx - 1);
    host.querySelector("[data-a=next]").onclick = () => go(idx + 1);
    pp.onclick = () => {
      if (state === "waiting") go(idx + 1);

      if (!host.isConnected) return;

      last = now;
      if (visible) {

})();

  Epi.flip(Object.values(cardEls), () => PEOPLE.forEach(p => move(p, rand() < 0.5 ? "tx" : "ctl")), { stagger: 35 });
  handMode = false; lastAction = "stSimple"; render();
}
function stratRandomize() {
  const strata = {};
  PEOPLE.forEach(p => { const k = p.sex + (p.age >= 50 ? "o" : "y"); (strata[k] = strata[k] || []).push(p); });
  Epi.flip(Object.values(cardEls), () => Object.values(strata).forEach(group => {
    const first = rand() < 0.5 ? "tx" : "ctl", second = first === "tx" ? "ctl" : "tx";
    shuffle(group.slice()).forEach((p, i) => move(p, i % 2 === 0 ? first : second));
  }), { stagger: 35 });
  handMode = false; lastAction = "stStrat"; render();
}

function summarize(zone) {
  const g = PEOPLE.filter(p => p.zone === zone);
  const n = g.length;
  return {
    n,
    f: n ? g.filter(p => p.sex === "F").length / n : NaN,
    old: n ? g.filter(p => p.age >= 50).length / n : NaN,
    age: n ? g.reduce((s, p) => s + p.age, 0) / n : NaN,
    hid: n ? g.filter(p => p.hidden).length / n : NaN,
    counts: { f: g.filter(p => p.sex === "F").length, old: g.filter(p => p.age >= 50).length, hid: g.filter(p => p.hidden).length }
  };
}

function render() {
  const reveal = document.getElementById("revealChk").checked;
  document.getElementById("board").classList.toggle("reveal", reveal);
  Object.values(cardEls).forEach(el => {
    const p = PEOPLE[el.dataset.id];
    el.querySelector(".sex").textContent = Epi.t(p.sex);
    el.setAttribute("aria-label", `${Epi.t(p.sex)} ${p.age}` + (reveal && p.hidden ? ", " + Epi.t("rowHidden") : ""));
  });
  const tx = summarize("tx"), ctl = summarize("ctl");
  const poolN = PEOPLE.filter(p => p.zone === "pool").length;
  document.getElementById("poolN").textContent = poolN;
  document.getElementById("txN").textContent = "n = " + tx.n;
  document.getElementById("ctlN").textContent = "n = " + ctl.n;

  const rows = [
    ["rowN", tx.n, ctl.n, tx.n - ctl.n, "n"],
    ["rowF", tx.f, ctl.f, tx.f - ctl.f, "p", tx.counts.f, ctl.counts.f],
    ["rowOld", tx.old, ctl.old, tx.old - ctl.old, "p", tx.counts.old, ctl.counts.old],
    ["rowAge", tx.age, ctl.age, tx.age - ctl.age, "y"],
    ["rowHidden", tx.hid, ctl.hid, tx.hid - ctl.hid, "p", tx.counts.hid, ctl.counts.hid, true]
  ];
  const body = document.getElementById("balBody");
  body.innerHTML = rows.map(r => {
    const [key, a, b, d, kind, ca, cb, isHidden] = r;
    const masked = isHidden && !reveal;
    const cell = (v, c) => {
      if (masked) return `<span class="small">${Epi.t("hiddenQ")}</span>`;
      if (kind === "n") return v;
      if (kind === "y") return Epi.fmt(v, 1);
      return isFinite(v) ? `${c} (${Math.round(v * 100)}%)` : "—";
    };
    let diffTxt = "—", bar = "", big = false;
    if (!masked && isFinite(d)) {
      if (kind === "p") { diffTxt = (d > 0 ? "+" : "") + Math.round(d * 100) + " pts"; big = Math.abs(d) >= 0.2; bar = Math.min(60, Math.abs(d) * 150); }
      else if (kind === "y") { diffTxt = (d > 0 ? "+" : "") + Epi.fmt(d, 1); big = Math.abs(d) >= 5; bar = Math.min(60, Math.abs(d) * 4); }
      else { diffTxt = (d > 0 ? "+" : "") + d; }
    }
    if (masked) diffTxt = "?";
    diffTxt = diffTxt.replace(" pts", " " + Epi.t("pts"));
    return `<tr><td>${Epi.t(key)}</td><td>${cell(a, ca)}</td><td>${cell(b, cb)}</td><td class="${big ? "diff-big" : ""}">${diffTxt}${bar ? `<span class="diff-bar" style="width:${bar}px;${big ? "background:var(--bad)" : ""}"></span>` : ""}</td></tr>`;
  }).join("");

  const st = document.getElementById("status");
  if (lastAction) st.textContent = Epi.t(lastAction);

let simResult = null;
function runSim() {
  const sizes = [20, 200, 2000];
  simResult = sizes.map(n => {
    const gaps = [];
    for (let t = 0; t < 1000; t++) {
      let nt = 0, nc = 0, ht = 0, hc = 0;
      for (let i = 0; i < n; i++) {
        const h = Math.random() < 0.4, toT = Math.random() < 0.5;
        if (toT) { nt++; if (h) ht++; } else { nc++; if (h) hc++; }
      }
      if (nt && nc) gaps.push(Math.abs(ht / nt - hc / nc));
    }
    gaps.sort((x, y) => x - y);
    return { n, mean: gaps.reduce((s, g) => s + g, 0) / gaps.length, p95: gaps[Math.floor(gaps.length * 0.95)] };
  });
  drawSim();
}
function drawSim() {
  const max = Math.max(...simResult.map(r => r.mean));

  out.innerHTML = simResult.map(r => `
    <div class="sim-row"><span>${Epi.t("simLabel", { n: r.n.toLocaleString() })}</span>
    <div class="sim-track"><div class="sim-fill" data-w="${(r.mean / max) * 100}"></div></div>
    <span class="num">${(r.mean * 100).toFixed(1)} ${Epi.t("pts")}</span></div>`).join("") +
    `<p class="small" style="margin-top:8px">${Epi.t("simFoot", { a: (simResult[0].p95 * 100).toFixed(0) + "%", b: (simResult[1].p95 * 100).toFixed(0) + "%", c: (simResult[2].p95 * 100).toFixed(0) + "%" })}</p>`;
  requestAnimationFrame(() => out.querySelectorAll(".sim-fill").forEach(f => f.style.width = f.dataset.w + "%"));
  Epi.check();
}

}

// ---------- table & metrics ----------

  const set = (id, v) => document.getElementById(id).textContent = v;

  set("pos", n(TP + FP)); set("neg", n(FN + TN)); set("dis", n(D)); set("nodis", n(ND)); set("tot", n(S.N));

  set("npv", Epi.fmt(TN / (TN + FN), 2)); set("fNpv", `TN/(TN+FN) = ${n(TN)}/${n(TN + FN)}`);

let lastSe = 0, lastPpv = 0, game = null;
const pick = a => a[Math.floor(Math.random() * a.length)];
function gameRound() {

// ---------- model ----------
const sToRR = v => 0.5 * Math.pow(16, v / 100), rrToS = r => Math.round(100 * Math.log(r / 0.5) / Math.log(16));
const S = { rr0: 1, rr1: 3, link: 0.6, base: 3 };
function model(p) {
  const N = 5000, b0 = 0.04, b1 = Math.min(0.9, 0.04 * p.base);
  const pe0 = 0.5 - 0.45 * p.link, pe1 = 0.5 + 0.45 * p.link;
  const st = [[pe0, b0, p.rr0], [pe1, b1, p.rr1]].map(([pe, b, rr]) => {
    const n1 = N * pe, n0 = N - n1, r1 = Math.min(1, b * rr), r0 = b;
    return { n1, n0, a: n1 * r1, c: n0 * r0, r1, r0, T: N };
  });
  const A = st[0].a + st[1].a, C = st[0].c + st[1].c, N1 = st[0].n1 + st[1].n1, N0 = st[0].n0 + st[1].n0;
  const crude = (A / N1) / (C / N0);
  const mh = st.reduce((s, x) => s + x.a * x.n0 / x.T, 0) / st.reduce((s, x) => s + x.c * x.n1 / x.T, 0);
  const s0 = st[0].r1 / st[0].r0, s1 = st[1].r1 / st[1].r0;
  const em = Math.max(s0, s1) / Math.min(s0, s1) >= 1.5, cf = Math.abs(crude / mh - 1) >= 0.10;
  return { st, crude, mh, s0, s1, em, cf };
}

// ---------- page update ----------
let lastM = null;
function update() {

const PRE = { pNeither: [2, 2, 0, 3], pConf: [1, 1, 0.8, 5], pEM: [1, 4, 0, 3], pBoth: [1, 4, 0.6, 3] };

// ---------- diagnosis game ----------
const G = { streak: 0, best: 0, correct: 0, n: 0, cur: null, picked: null };
const KEYS = ["conf", "em", "both", "neither"];
function classify(m) { return m.em && m.cf ? "both" : m.em ? "em" : m.cf ? "conf" : "neither"; }
function newCase() {
  const want = KEYS[Math.floor(Math.random() * 4)];
  for (let tries = 0; tries < 4000; tries++) {
    const p = { rr0: +(0.6 + Math.random() * 4).toFixed(2), rr1: 0, link: (Math.random() * 2 - 1) * 0.9, base: 1 + Math.random() * 6 };
    p.rr1 = Math.random() < 0.5 ? p.rr0 * (0.9 + Math.random() * 0.2) : +(0.6 + Math.random() * 5).toFixed(2);
    const m = model(p);
    const ratio = Math.max(m.s0, m.s1) / Math.min(m.s0, m.s1), chg = Math.abs(m.crude / m.mh - 1);
    if ((ratio > 1.2 && ratio < 1.8) || (chg > 0.05 && chg < 0.18)) continue;   // avoid borderline cases

  let fb = "";

    fb = `<p class="${ok ? "good" : "bad"}" style="font-weight:800;font-size:18px;margin:6px 0 2px">${ok ? Epi.t("gRight") : Epi.t("gWrong", { a: Epi.t(lbl[G.cur.ans]) })}</p>
      <p class="small">${Epi.t("gWhy", { s0: f(m.s0), s1: f(m.s1), em: Epi.t(m.em ? "gEmY" : "gEmN"), c: f(m.crude), ad: f(m.mh), cf: Epi.t(m.cf ? "gCfY" : "gCfN") })}</p>`;
  }
  document.getElementById("game").innerHTML = `<div class="gcard"><table>
      <tr><td>${Epi.t("gS0")}</td><td class="v">${f(m.s0)}</td></tr>
      <tr><td>${Epi.t("gS1")}</td><td class="v">${f(m.s1)}</td></tr>
      <tr><td>${Epi.t("gCrude")}</td><td class="v bad">${f(m.crude)}</td></tr>
      <tr><td>${Epi.t("gAdj")}</td><td class="v a">${f(m.mh)}</td></tr></table></div>
    <div class="opts">${KEYS.map(k => `<button class="opt ${G.picked ? (k === G.cur.ans ? "right" : k === G.picked ? "wrong" : "") : ""}" data-k="${k}" ${G.picked ? "disabled" : ""}>${Epi.t(lbl[k])}</button>`).join("")}</div>
    ${fb}
    <div class="btn-row" style="align-items:center">${G.picked ? `<button class="btn" id="gNext">${Epi.t("gNext")}</button>` : ""}<span class="small">${Epi.t("gStreak", { s: G.streak, c: G.correct, n: G.n })}</span></div>`;

    th0: "", thCa: "Breast cancer +", thCo: "Breast cancer −",
    ever: "Ever used pesticides", never: "Never used pesticides", orRow: "Odds ratio", trueW: "true", obsW: "observed",
    n1: "Non-differential: exposure is misclassified equally in cases and controls (for example, a common pesticide left off the questionnaire). With a binary exposure, the odds ratio is pulled towards the null (1.0), so estimates are usually more conservative.",
    n2: "Differential: misclassification is related to disease status, for example recall bias (cases search their memory harder) or interviewer bias. The bias can go in either direction, away from or towards the null.",
    n3: "Lowering specificity in cases only (cases over-report use) reproduces the office hour example: the odds ratio rises from 1.29 to 1.36."
  },
  zh: {
    pageTitle: "非差異性與差異性錯誤分類", title: "非差異性與差異性錯誤分類",
    lede: "一項探討庭院農藥使用與乳癌的病例對照研究，真實的勝算比為 1.29。讓曝露問卷變得不準確（在病例組、對照組或兩組），觀察所觀察到的勝算比往哪裡移動。",
    orH: "觀察勝算比與真實勝算比", pctH: "被歸類為「曾經曝露」的比例", tabH: "真實與觀察到的人數",
    setH: "曝露測量有多準確？",
    pTruth: "完美測量", pNon: "非差異性（投影片 59）", pRecall: "回憶偏差：病例多報（投影片 60）", pUnder: "對照組少報",
    linkL: "病例組與對照組準確度相同（非差異性）",
    cases: "病例組", casesS: "（乳癌 +）", ctrls: "對照組", ctrlsS: "（乳癌 −）",
    se: "靈敏度：曾使用者被記錄為曾使用", sp: "特異度：未使用者被記錄為未使用",
    nul: "虛無值", truthL: "真實 {v}", obsL: "觀察 {v}",
    vSame: "沒有錯誤分類：觀察勝算比等於真實值。",
    vToward: "偏向虛無值：{t} 變成 {o}。",
    vAway: "偏離虛無值：{t} 變成 {o}。",
    vCross: "偏差越過虛無值：{t} 變成 {o}，結論方向因此相反。",
    kNon: "非差異性", kDiff: "差異性",
    trueCa: "病例組，真實", obsCa: "病例組，觀察", trueCo: "對照組，真實", obsCo: "對照組，觀察",
    th0: "", thCa: "乳癌 +", thCo: "乳癌 −",
    ever: "曾使用農藥", never: "從未使用農藥", orRow: "勝算比", trueW: "真實", obsW: "觀察",
    n1: "非差異性：病例組與對照組的曝露被同等錯誤分類（例如問卷漏列一種常見農藥）。在二元曝露下，勝算比會被拉向虛無值（1.0），因此估計通常較保守。",
    n2: "差異性：錯誤分類與疾病狀態有關，例如回憶偏差（病例更努力回想）或訪談者偏差。偏差方向可能偏離或偏向虛無值。",
    n3: "只降低病例組的特異度（病例多報使用）即可重現課堂範例：勝算比由 1.29 上升到 1.36。"
  }
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("orsvg");
function mk(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
const OMIN = 0.5, OMAX = 3, X0 = 30, X1 = 690, Y = 125;
const ox = v => X0 + (Math.log(Epi.clamp(v, OMIN, OMAX) / OMIN) / Math.log(OMAX / OMIN)) * (X1 - X0);

function observe() {
  const caE = S.seCa / 100 * TRUTH.caE + (1 - S.spCa / 100) * TRUTH.caU;
  const coE = S.seCo / 100 * TRUTH.coE + (1 - S.spCo / 100) * TRUTH.coU;
  return { caE, caU: TRUTH.caE + TRUTH.caU - caE, coE, coU: TRUTH.coE + TRUTH.coU - coE };
}
const orOf = t => (t.caE / t.caU) / (t.coE / t.coU);

function drawOR(tor, oor) {
  svg.innerHTML = "";
  mk("defs", {}).innerHTML = `<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--bad)"/></marker>`;
  mk("line", { x1: X0, x2: X1, y1: Y, y2: Y, stroke: "var(--muted)" });
  [0.5, 0.75, 1, 1.25, 1.5, 2, 3].forEach(v => {
    mk("line", { x1: ox(v), x2: ox(v), y1: Y, y2: Y + 6, stroke: "var(--muted)" });
    mk("text", { x: ox(v), y: Y + 30, "text-anchor": "middle", class: "tick" }).textContent = v;
  });
  mk("line", { x1: ox(1), x2: ox(1), y1: 40, y2: Y, stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "4 4" });
  mk("text", { x: ox(1), y: 28, "text-anchor": "middle", class: "tick" }).textContent = Epi.t("nul") + " 1.0";
  mk("text", { x: (X0 + X1) / 2, y: Y + 60, "text-anchor": "middle", class: "tick" }).textContent = "OR (log)";
  const moved = Math.abs(oor - tor) > 0.004, right = oor > tor;
  if (moved) {
    mk("line", { x1: ox(tor), x2: ox(oor) + (right ? -11 : 11), y1: Y, y2: Y, stroke: "var(--bad)", "stroke-width": 4, "marker-end": "url(#arr)" });
    mk("circle", { cx: ox(oor), cy: Y, r: 9, fill: "var(--bad)" });
    mk("text", { x: ox(oor) + (right ? 6 : -6), y: Y - 22, "text-anchor": right ? "start" : "end", class: "ortxt", fill: "var(--bad)" }).textContent = Epi.t("obsL", { v: oor.toFixed(2) });
  }
  mk("circle", { cx: ox(tor), cy: Y, r: 9, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 3 });
  mk("text", { x: ox(tor) + (moved ? (right ? -6 : 6) : 0), y: Y - 22, "text-anchor": moved ? (right ? "end" : "start") : "middle", class: "ortxt", fill: "var(--ink)" }).textContent = Epi.t("truthL", { v: tor.toFixed(2) });
}

function update() {
  ["seCa", "spCa", "seCo", "spCo"].forEach(k => { document.getElementById(k).value = S[k]; document.getElementById(k + "O").textContent = S[k] + "%"; });
  const o = observe(), tor = orOf(TRUTH), oor = orOf(o);
  drawOR(tor, oor);
  const diff = !(S.seCa === S.seCo && S.spCa === S.spCo);
  const v = document.getElementById("verdict");
  const t2 = tor.toFixed(2), o2 = oor.toFixed(2);
  let key = "vSame";
  if (t2 !== o2) {
    if ((oor - 1) * (tor - 1) < 0) key = "vCross";
    else key = Math.abs(Math.log(oor)) < Math.abs(Math.log(tor)) ? "vToward" : "vAway";
  }
  v.innerHTML = (key === "vSame" ? "" : `<span class="small" style="display:block;font-weight:600">${Epi.t(diff ? "kDiff" : "kNon")}</span>`) + Epi.t(key, { t: t2, o: o2 });
  v.className = "verdict " + (key === "vSame" ? "" : key === "vToward" ? "a" : "bad");

  lastOR = oor; lastDiff = diff; Epi.check();
  const pc = (e, u) => e / (e + u);
  const bar = (lab, p, col) => `<div class="pbar"><span>${lab}</span><div class="track"><div class="fill" style="width:${p * 100}%;background:${col}"></div></div><span class="num">${Math.round(p * 100)}%</span></div>`;
  document.getElementById("pct").innerHTML =
    bar(Epi.t("trueCa"), pc(TRUTH.caE, TRUTH.caU), "var(--rule)") + bar(Epi.t("obsCa"), pc(o.caE, o.caU), "var(--bad)") +
    bar(Epi.t("trueCo"), pc(TRUTH.coE, TRUTH.coU), "var(--rule)") + bar(Epi.t("obsCo"), pc(o.coE, o.coU), "var(--muted)");

  const r = Math.round;
  const cell = (tv, ov) => { const d = r(ov) - tv; return `${r(ov).toLocaleString()} <span class="small">(${Epi.t("trueW")} ${tv.toLocaleString()})</span>${d ? `<span class="chg ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${d}</span>` : ""}`; };
  document.getElementById("tab").innerHTML =
    `<thead><tr><th></th><th>${Epi.t("thCa")}</th><th>${Epi.t("thCo")}</th></tr></thead><tbody>
     <tr><td>${Epi.t("ever")}</td><td>${cell(TRUTH.caE, o.caE)}</td><td>${cell(TRUTH.coE, o.coE)}</td></tr>
     <tr><td>${Epi.t("never")}</td><td>${cell(TRUTH.caU, o.caU)}</td><td>${cell(TRUTH.coU, o.coU)}</td></tr>
     <tr><td>${Epi.t("orRow")}</td><td colspan="2" style="text-align:center"><b>${o2}</b> <span class="small">(${Epi.t("trueW")} ${t2})</span></td></tr></tbody>`;
}

function renderPresets() {
  const box = document.getElementById("presets");
  box.innerHTML = [["truth", "pTruth"], ["nondiff", "pNon"], ["recall", "pRecall"], ["under", "pUnder"]]
    .map(([k, l]) => `<button class="btn ghost" data-k="${k}">${Epi.t(l)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const v = PRE[b.dataset.k];
    [S.seCa, S.spCa, S.seCo, S.spCo] = v;
    document.getElementById("link").checked = v[0] === v[2] && v[1] === v[3];
    update();
  });
}
["seCa", "spCa", "seCo", "spCo"].forEach(k => document.getElementById(k).addEventListener("input", e => {
  S[k] = Number(e.target.value);
  if (document.getElementById("link").checked) {
    const twin = { seCa: "seCo", seCo: "seCa", spCa: "spCo", spCo: "spCa" }[k];
    S[twin] = S[k];
  }
  update();
}));
document.getElementById("link").onchange = e => { if (e.target.checked) { S.seCo = S.seCa; S.spCo = S.spCa; } update(); };
Epi.missions("misclassification", document.getElementById("missions"), [
  { id: "nd110", en: "With non-differential misclassification only, pull the odds ratio below 1.10.", zh: "只用非差異性錯誤分類，把勝算比拉到 1.10 以下。", test: () => !lastDiff && lastOR < 1.1 },
  { id: "away", en: "Push the odds ratio above 1.60, away from the null.", zh: "把勝算比推到 1.60 以上，偏離虛無值。", test: () => lastOR > 1.6 },
  { id: "cross", en: "Make the observed odds ratio cross the null: pesticides now look protective.", zh: "讓觀察勝算比越過虛無值：農藥看起來變成有保護作用。", test: () => lastOR < 1 },
  { id: "s60", en: "Reproduce the office hour recall-bias result: OR = 1.36 with differential misclassification.", zh: "重現課堂的回憶偏差結果：差異性錯誤分類下 OR = 1.36。", test: () => lastDiff && lastOR.toFixed(2) === "1.36" }
]);
Epi.loopAnim(document.getElementById("loop"), EpiLoops["misclassification"]);
Epi.init(I18N, () => { renderPresets(); update(); });

};
function show() {
  let name = decodeURIComponent(location.hash.slice(1)) || "index";
  if (!PAGES[name]) name = "index";
  const app = document.getElementById("app");
  app.replaceChildren(document.getElementById("tpl-" + name).content.cloneNode(true));
  window.scrollTo(0, 0);
  PAGES[name]();
}
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
